<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Lets the bridge's service user talk to BlueZ even where the distribution's bluetooth.conf
     limits org.bluez to the bluetooth group. Installed to /etc/dbus-1/system.d. -->
<busconfig>
  <policy user="fido2-ble-bridge">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
