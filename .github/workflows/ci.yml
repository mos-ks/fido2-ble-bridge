name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The uv that wrote linux/uv.lock (lock revision 3); a newer uv must not decide what
          # `uv sync --locked` accepts or what the installer's requirements are checked against.
          version: "0.12.17"
          python-version: ${{ matrix.python }}
          working-directory: linux
      - run: uv sync --locked
      - name: Installer requirements match uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            | tail -n +3 | diff - <(tail -n +3 packaging/requirements.txt)
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

      - name: End-to-end prerequisites (uhid, libfido2, pam_u2f)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpam-u2f pamu2fcfg fido2-tools
          # The runner's cloud kernel keeps uhid in the extra-modules package.
          sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
          sudo modprobe uhid
          # No desktop seat on the runner, so grant what uaccess would grant a logged-in user.
          printf '%s\n' \
            'KERNEL=="uhid", MODE="0666"' \
            'SUBSYSTEM=="hidraw", ENV{ID_SECURITY_TOKEN}=="1", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-ci-fido.rules
          sudo udevadm control --reload-rules
          sudo chmod 0666 /dev/uhid

      - run: uv run pytest -v -rs

      - name: Fail if the end-to-end tests were skipped
        run: |
          uv run pytest -m uhid -q -rs | tee e2e.txt
          ! grep -q SKIPPED e2e.txt

  windows:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build Fido2BleLogon.slnx -c Release -warnaserror
      - run: dotnet test tests/Fido2BleLogon.Core.Tests -c Release --no-build
      - name: Credential provider self-test (offline, simulated key, no Bluetooth)
        run: |
          $exe = Get-ChildItem -Recurse -Filter fido2-ble-logon-cphost.exe src/Fido2BleLogon.CpHarness/bin |
            Where-Object FullName -match '\\Release\\' | Select-Object -First 1
          if (-not $exe) { throw 'the harness was not built' }
          & $exe.FullName selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe.FullName credui
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: PowerShell scripts parse under Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          foreach ($script in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors; $bad++ }
          }
          if ($bad) { exit 1 }